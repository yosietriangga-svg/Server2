<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Saya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #3498db;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        .backup-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #eef2f5;
            border-radius: 6px;
        }

        .btn-secondary {
            background-color: #3498db;
            font-size: 13px;
            padding: 8px;
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #2980b9;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: #fdfdfd;
            border-left: 5px solid #3498db;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            word-wrap: break-word;
        }

        .note-card h3 {
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .note-card p {
            color: #555;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .note-card .date {
            font-size: 11px;
            color: #999;
            margin-top: 10px;
            display: block;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Catatan Saya</h1>
        
        <div class="input-group">
            <input type="text" id="noteTitle" placeholder="Judul catatan..." required>
            <textarea id="noteContent" placeholder="Tulis isi catatan di sini..." required></textarea>
            <button onclick="addNote()">Tambah Catatan</button>
        </div>

        <!-- Tombol Tambahan Khusus Incognito / Backup -->
        <div class="backup-tools">
            <button class="btn-secondary" onclick="exportNotes()">💾 Unduh Catatan (Backup)</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 Buka File Catatan</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importNotes(event)">
        </div>

        <div class="notes-list" id="notesContainer">
            <!-- Catatan akan muncul di sini -->
        </div>
    </div>

    <script>
        // Memori sementara jika LocalStorage diblokir total oleh Incognito
        let inMemoryNotes = [];

        function isLocalStorageAvailable() {
            try {
                const testKey = '__test__';
                localStorage.setItem(testKey, testKey);
                localStorage.removeItem(testKey);
                return true;
            } catch (e) {
                return false;
            }
        }

        function getNotes() {
            if (isLocalStorageAvailable()) {
                const notes = localStorage.getItem('my_notes');
                return notes ? JSON.parse(notes) : [];
            }
            return inMemoryNotes;
        }

        function saveNotes(notes) {
            inMemoryNotes = notes;
            if (isLocalStorageAvailable()) {
                try {
                    localStorage.setItem('my_notes', JSON.stringify(notes));
                } catch (e) {
                    console.warn('Gagal menyimpan ke LocalStorage:', e);
                }
            }
        }

        function addNote() {
            const titleInput = document.getElementById('noteTitle');
            const contentInput = document.getElementById('noteContent');

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) {
                alert('Judul dan isi catatan tidak boleh kosong!');
                return;
            }

            const newNote = {
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            };

            const notes = getNotes();
            notes.unshift(newNote);
            saveNotes(notes);

            titleInput.value = '';
            contentInput.value = '';

            renderNotes();
        }

        function deleteNote(id) {
            if (confirm('Apakah Anda yakin ingin menghapus catatan ini?')) {
                let notes = getNotes();
                notes = notes.filter(note => note.id !== id);
                saveNotes(notes);
                renderNotes();
            }
        }

        function renderNotes() {
            const notesContainer = document.getElementById('notesContainer');
            const notes = getNotes();

            if (notes.length === 0) {
                notesContainer.innerHTML = '<p class="empty-msg">Belum ada catatan.</p>';
                return;
            }

            notesContainer.innerHTML = '';
            notes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                noteCard.innerHTML = `
                    <h3>${escapeHtml(note.title)}</h3>
                    <p>${escapeHtml(note.content)}</p>
                    <span class="date">${note.date}</span>
                    <button class="btn-delete" onclick="deleteNote(${note.id})">Hapus</button>
                `;
                notesContainer.appendChild(noteCard);
            });
        }

        // Fitur Ekspor Data ke File (.json)
        function exportNotes() {
            const notes = getNotes();
            if (notes.length === 0) {
                alert('Tidak ada catatan untuk diunduh.');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `catatan_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Fitur Impor Data dari File (.json)
        function importNotes(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    if (Array.isArray(importedNotes)) {
                        saveNotes(importedNotes);
                        renderNotes();
                        alert('Catatan berhasil dimuat!');
                    } else {
                        alert('Format file tidak sesuai.');
                    }
                } catch (err) {
                    alert('Gagal membaca file backup.');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', renderNotes);
    </script>
</body>
</html>
