<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat HP</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mut:#6b7280;--pri:#16a34a;--me:#dcfce7;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--tx:#eceef1;--mut:#9aa1ac;--me:#14532d;--bd:#2a2e35}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
header{padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);padding:6px 8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.box{padding:12px 14px}
.idcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.idcard b{font-size:22px;letter-spacing:1px;color:var(--pri)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;margin:8px 0}
#list{flex:1;overflow:auto;padding:0 14px 14px}
.u{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.u b{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af}
.dot.on{background:var(--pri)}
.badge{background:#ef4444;color:#fff;border-radius:99px;font-size:12px;padding:1px 7px}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 11px;border-radius:14px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}
.m small{display:block;color:var(--mut);font-size:11px;margin-top:2px;text-align:right}
.bar{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--bd)}
#status{padding:6px 14px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ghost" id="back" style="display:none">←</button>
    <h1 id="title">Chat HP</h1>
    <span class="mut" id="cstat"></span>
  </header>
  <div id="status">Menghubungkan…</div>

  <div id="home" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="box">
      <div class="idcard">
        <div class="mut">ID HP kamu (permanen)</div>
        <b id="myid">…</b>
        <div class="mut" style="margin-top:6px">Bagikan ID ini ke teman. Tersimpan di HP ini dan tidak berubah.</div>
      </div>
      <div class="row">
        <input id="peerid" placeholder="ID teman, mis. HP-123456" autocapitalize="characters">
        <button id="go">Chat</button>
      </div>
      <details class="mut"><summary>Pindah HP? Pakai ID lama</summary>
        <div class="row"><input id="restore" placeholder="HP-xxxxxx"><button id="rbtn">Pakai</button></div>
      </details>
    </div>
    <div class="mut" style="padding:0 14px 6px">Kontak</div>
    <div id="list"></div>
  </div>

  <div id="chat">
    <div id="msgs"></div>
    <div class="bar"><input id="txt" placeholder="Tulis pesan…"><button id="send">Kirim</button></div>
  </div>
</div>

<script>
var mem={};
function lsGet(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function $(i){return document.getElementById(i)}
function digits(s){return String(s||'').replace(/\D/g,'')}
function toPeer(d){return 'chathp-'+digits(d)}
function toDisp(p){return 'HP-'+p.replace('chathp-','')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

var myId=lsGet('hp_id');
if(!myId){myId='HP-'+Math.floor(100000+Math.random()*900000);lsSet('hp_id',myId)}
var contacts=JSON.parse(lsGet('hp_contacts')||'[]');
var chats=JSON.parse(lsGet('hp_chats')||'{}');
var unread=JSON.parse(lsGet('hp_unread')||'{}');
var conns={}, peer=null, current=null;

function save(){lsSet('hp_contacts',JSON.stringify(contacts));lsSet('hp_chats',JSON.stringify(chats));lsSet('hp_unread',JSON.stringify(unread))}
function setStatus(t){$('status').textContent=t}
function isOnline(d){var c=conns[toPeer(d)];return !!(c&&c.open)}
function addContact(d){if(contacts.indexOf(d)<0){contacts.push(d);save()}}

function startPeer(){
  $('myid').textContent=myId;
  if(typeof Peer==='undefined'){setStatus('Gagal memuat PeerJS. Cek koneksi internet.');return}
  peer=new Peer(toPeer(myId));
  peer.on('open',function(){setStatus('Online sebagai '+myId);contacts.forEach(function(d){connectTo(toPeer(d))})});
  peer.on('connection',setupConn);
  peer.on('disconnected',function(){setStatus('Terputus, menyambung ulang…');setTimeout(function(){try{peer.reconnect()}catch(e){}},2000)});
  peer.on('error',function(e){
    if(e.type==='unavailable-id')setStatus('ID ini sedang dipakai di tab/HP lain. Tutup yang lain lalu muat ulang.');
    else if(e.type==='peer-unavailable')render();
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error')setStatus('Masalah jaringan, mencoba lagi…');
  });
}

function setupConn(c){
  var pid=c.peer;
  conns[pid]=c;
  c.on('open',function(){addContact(toDisp(pid));flush(pid);render()});
  c.on('data',function(d){onData(pid,d)});
  c.on('close',function(){if(conns[pid]===c)delete conns[pid];render()});
  c.on('error',function(){if(conns[pid]===c)delete conns[pid];render()});
}
function connectTo(pid){
  var c=conns[pid];
  if(c&&c.open)return;
  if(!peer||peer.disconnected||peer.destroyed)return;
  setupConn(peer.connect(pid,{reliable:true}));
}
function flush(pid){
  var d=toDisp(pid),c=conns[pid];
  if(!c||!c.open)return;
  (chats[d]||[]).forEach(function(m){if(m.from==='me'&&!m.ok)c.send({t:'msg',id:m.id,text:m.text,ts:m.ts})});
}
function onData(pid,d){
  var disp=toDisp(pid);
  if(d.t==='msg'){
    chats[disp]=chats[disp]||[];
    if(!chats[disp].some(function(m){return m.id===d.id})){
      chats[disp].push({id:d.id,from:'them',text:String(d.text).slice(0,1000),ts:d.ts||Date.now()});
      if(current!==disp)unread[disp]=(unread[disp]||0)+1;
    }
    addContact(disp);save();
    try{conns[pid].send({t:'ack',id:d.id})}catch(e){}
  }else if(d.t==='ack'){
    (chats[disp]||[]).forEach(function(m){if(m.id===d.id)m.ok=true});save();
  }
  render();
}

function render(){
  var l=$('list');l.textContent='';
  if(!contacts.length){l.innerHTML='<div class="mut">Belum ada kontak. Masukkan ID teman di atas.</div>'}
  contacts.forEach(function(d){
    var el=document.createElement('div');el.className='u';
    var dot=document.createElement('span');dot.className='dot'+(isOnline(d)?' on':'');
    var b=document.createElement('b');b.textContent=d;
    el.appendChild(dot);el.appendChild(b);
    if(unread[d]){var bg=document.createElement('span');bg.className='badge';bg.textContent=unread[d];el.appendChild(bg)}
    el.onclick=function(){openChat(d)};
    l.appendChild(el);
  });
  if(current){
    $('cstat').textContent=isOnline(current)?'online':'offline';
    var box=$('msgs');box.textContent='';
    (chats[current]||[]).slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(m){
      var el=document.createElement('div');el.className='m'+(m.from==='me'?' me':'');
      el.textContent=m.text;
      var t=document.createElement('small');
      t.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(m.from==='me'?(m.ok?' ✓✓':' ⏳'):'');
      el.appendChild(t);box.appendChild(el);
    });
    box.scrollTop=box.scrollHeight;
  }
}

function openChat(raw){
  var n=digits(raw);
  if(n.length!==6){alert('ID harus format HP-123456');return}
  var d='HP-'+n;
  if(d===myId){alert('Itu ID kamu sendiri');return}
  addContact(d);current=d;unread[d]=0;save();
  $('home').style.display='none';$('chat').style.display='flex';
  $('back').style.display='inline-block';$('title').textContent=d;
  connectTo(toPeer(d));render();
}
function closeChat(){
  current=null;$('chat').style.display='none';$('home').style.display='flex';
  $('back').style.display='none';$('title').textContent='Chat HP';$('cstat').textContent='';render();
}
function send(){
  var t=$('txt').value.trim();
  if(!t||!current)return;
  $('txt').value='';
  var m={id:uid(),from:'me',text:t.slice(0,1000),ts:Date.now(),ok:false};
  (chats[current]=chats[current]||[]).push(m);save();
  var c=conns[toPeer(current)];
  if(c&&c.open)c.send({t:'msg',id:m.id,text:m.text,ts:m.ts});else connectTo(toPeer(current));
  render();
}
function restore(){
  var n=digits($('restore').value);
  if(n.length!==6){alert('Format ID: HP-123456');return}
  if(!confirm('Ganti ID HP ini menjadi HP-'+n+'? Riwayat chat di HP ini tidak ikut pindah.'))return;
  lsSet('hp_id','HP-'+n);location.reload();
}

$('go').onclick=function(){openChat($('peerid').value);$('peerid').value=''};
$('back').onclick=closeChat;
$('send').onclick=send;
$('txt').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
$('rbtn').onclick=restore;
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&peer){
    if(peer.disconnected)try{peer.reconnect()}catch(e){}
    contacts.forEach(function(d){connectTo(toPeer(d))});
  }
});
setInterval(function(){if(peer&&peer.open){contacts.forEach(function(d){connectTo(toPeer(d))});render()}},15000);
render();startPeer();
</script>
</body>
</html>
